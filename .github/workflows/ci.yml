name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

# Le workspace Cargo vit dans build/ (src-tauri/ + src/ frontend).
defaults:
  run:
    working-directory: ./build

jobs:
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # -A dead-code : le squelette multi-provider expose une API publique
      # non encore branchée aux commandes IPC (registry/pool/fallback).
      # À retirer quand l'IPC sera câblé.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -A dead-code

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo deny (licences + advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build Tauri multi-plateforme (projet Tauri v2 actif dans build/).
  build-tauri:
    name: Build Tauri (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: app-linux
          - os: macos-latest
            artifact_name: app-macos
          - os: windows-latest
            artifact_name: app-windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./build/src/package-lock.json
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./build/src
      - name: Build frontend (Vite)
        run: npm run build
        working-directory: ./build/src
      - name: Build Tauri (bundle)
        uses: tauri-apps/tauri-action@v0
        working-directory: ./build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
