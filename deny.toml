# Configuration cargo-deny pour OBSI (workspace build/)
# Vérifiée par le job "Security Audit" du workflow CI.

[graph]
# Analyse le workspace complet
exclude = []

[licenses]
# Politique (cargo-deny ≥ 0.14, PR #611) : tout ce qui n'est PAS dans `allow`
# est refusé par défaut — `deny`, `unlicensed`, `allow-osi-fsf-free`, `default`
# ont été retirés du format.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Exceptions documentées si nécessaire (aucune pour l'instant)
exceptions = [
    # { name = "exemple-crate", version = "*", allow = ["License-Exception"] },
]

[advisories]
# cargo-deny ≥ 0.17 (PR #611) : `vulnerability`, `yanked` sont retirés —
# les vulnérabilités actives et crates yanked font échouer par défaut.
# `unmaintained = "workspace"` : vérifie uniquement nos dépendances DIRECTES —
# les dépendances transitives de l'écosystème Tauri/GTK3 (webkit2gtk-4.1,
# bindings GTK3 non maintenus) sont ignorées car obligatoires et sans
# vulnérabilité active. Valeurs : all | workspace | transitive | none
unmaintained = "workspace"

[bans]
# Cratas bannis pour raisons de sécurité/maintenance
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # { name = "crate-a-vulnerable", version = "<0.5.0" },
]

[sources]
# Seuls crates.io et git sont autorisés (pas de registres inconnus)
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []

[output]
# Format lisible pour les logs CI
feature-depth = 1
